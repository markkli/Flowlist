name: Tests
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: backend/.venv/bin/python -m pytest backend/tests -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - run: npm --prefix frontend run test:e2e -- auth.spec.ts ritual.spec.ts --workers=2
        env:
          FLOWLIST_TEST_BROWSER: webkit

  postgres-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: flowlist-test-only
          POSTGRES_DB: flowlist_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python backend/scripts/verify_postgres.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:flowlist-test-only@127.0.0.1:5432/flowlist_test
