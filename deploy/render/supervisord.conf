[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/flowlist-supervisord.pid
childlogdir=/tmp

[program:api]
command=/usr/local/bin/uvicorn main:app --host 127.0.0.1 --port 8000 --workers 1 --no-access-log
directory=/app
priority=10
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/usr/sbin/nginx -c /tmp/flowlist-nginx.conf -g "daemon off;"
priority=20
autorestart=unexpected
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
