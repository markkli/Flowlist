<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Source Sans 3', sans-serif; background: #F0FDFA; color: #134E4A; }
    h1, h2, .brand { font-family: 'Lexend', sans-serif; }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-3xl mx-auto px-6 py-10">
    <h1 class="brand text-2xl font-semibold text-teal-800 mb-1">Flowlist</h1>
    <p class="text-teal-700/70 mb-6">Goals and tasks, talking to a real API.</p>

    <div id="stats-bar" class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-white border border-teal-100 rounded-xl p-4 text-center">
        <p id="stat-streak" class="brand text-2xl font-semibold text-teal-800">0</p>
        <p class="text-xs text-teal-700/60">day streak</p>
      </div>
      <div class="bg-white border border-teal-100 rounded-xl p-4 text-center">
        <p id="stat-sessions" class="brand text-2xl font-semibold text-teal-800">0</p>
        <p class="text-xs text-teal-700/60">sessions</p>
      </div>
      <div class="bg-white border border-teal-100 rounded-xl p-4 text-center">
        <p id="stat-minutes" class="brand text-2xl font-semibold text-teal-800">0</p>
        <p class="text-xs text-teal-700/60">minutes focused</p>
      </div>
    </div>

    <nav class="flex gap-2 mb-6">
      <button id="nav-goals" class="nav-tab text-sm font-medium px-3 py-1.5 rounded-lg cursor-pointer transition-colors bg-teal-600 text-white">Goals</button>
      <button id="nav-history" class="nav-tab text-sm font-medium px-3 py-1.5 rounded-lg cursor-pointer transition-colors bg-white text-teal-700 border border-teal-200">History</button>
    </nav>

    <div id="goals-view">
      <section class="bg-white border border-teal-100 rounded-xl p-5 mb-6">
        <h2 class="font-medium mb-3">New goal</h2>
        <form id="goal-form" class="flex gap-2">
          <input id="goal-title" type="text" placeholder="e.g. Learn FastAPI"
            class="flex-1 border border-teal-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
          <button class="bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium px-4 py-2 rounded-lg cursor-pointer transition-colors">
            Add goal
          </button>
        </form>
      </section>

      <div id="goals" class="space-y-4"></div>
    </div>

    <div id="history-view" class="hidden space-y-2"></div>
  </div>

  <template id="goal-template">
    <section class="bg-white border border-teal-100 rounded-xl p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="goal-title font-medium text-lg"></h2>
        <button class="delete-goal text-sm text-red-600 hover:text-red-700 cursor-pointer">Delete goal</button>
      </div>
      <ul class="task-list space-y-2 mb-3"></ul>
      <form class="task-form flex gap-2">
        <input type="text" placeholder="New task"
          class="flex-1 border border-teal-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
        <input type="number" min="1" value="25" title="Estimated minutes"
          class="task-minutes w-16 border border-teal-200 rounded-lg px-2 py-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-teal-500" />
        <button class="bg-teal-50 hover:bg-teal-100 text-teal-800 text-sm font-medium px-4 py-2 rounded-lg cursor-pointer transition-colors">
          Add task
        </button>
      </form>
    </section>
  </template>

  <template id="task-template">
    <li class="task-node">
      <div class="flex items-center gap-3 border border-teal-50 bg-teal-50/40 rounded-lg px-3 py-2">
        <input type="checkbox" class="task-completed w-4 h-4 accent-teal-600 cursor-pointer" />
        <span class="task-title flex-1 text-sm"></span>
        <span class="task-progress text-xs text-teal-700/60"></span>
        <span class="task-minutes-label text-xs text-teal-700/60"></span>
        <button class="start-focus text-xs bg-teal-600 hover:bg-teal-700 text-white px-3 py-1.5 rounded-lg cursor-pointer transition-colors">Focus</button>
        <button class="add-subtask text-xs text-teal-700 hover:text-teal-800 cursor-pointer">+ Subtask</button>
        <button class="break-down text-xs text-teal-700 hover:text-teal-800 cursor-pointer">Break down</button>
        <button class="delete-task text-xs text-red-600 hover:text-red-700 cursor-pointer">Remove</button>
      </div>
      <form class="subtask-form hidden flex gap-2 mt-2 ml-6">
        <input type="text" placeholder="Subtask title"
          class="flex-1 border border-teal-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
        <input type="number" min="1" value="25" title="Estimated minutes"
          class="subtask-minutes w-16 border border-teal-200 rounded-lg px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-teal-500" />
        <button class="bg-teal-50 hover:bg-teal-100 text-teal-800 text-xs font-medium px-3 py-1.5 rounded-lg cursor-pointer transition-colors">Add</button>
      </form>
      <ul class="suggestion-list space-y-2 mt-2 ml-6"></ul>
      <ul class="subtask-list space-y-2 mt-2 ml-6"></ul>
    </li>
  </template>

  <template id="suggestion-template">
    <li class="flex items-center gap-3 border border-dashed border-teal-200 bg-white rounded-lg px-3 py-2">
      <span class="suggestion-title flex-1 text-sm text-teal-800"></span>
      <span class="suggestion-minutes text-xs text-teal-700/60"></span>
      <button class="suggestion-add text-xs bg-teal-50 hover:bg-teal-100 text-teal-800 px-3 py-1.5 rounded-lg cursor-pointer transition-colors">Add</button>
    </li>
  </template>

  <template id="session-template">
    <div class="bg-white border border-teal-100 rounded-xl p-4 flex items-center justify-between">
      <div>
        <p class="session-title text-sm font-medium"></p>
        <p class="session-meta text-xs text-teal-700/60"></p>
      </div>
      <span class="session-status text-xs px-2 py-1 rounded-full"></span>
    </div>
  </template>

  <div id="focus-overlay" class="hidden fixed inset-0 bg-teal-950/60 flex items-center justify-center">
    <div class="bg-white rounded-2xl p-8 w-80 text-center">
      <p id="focus-task-title" class="text-sm text-teal-700/70 mb-2"></p>
      <p id="focus-time" class="brand text-5xl font-semibold text-teal-800 mb-6">25:00</p>
      <button id="focus-stop" class="w-full bg-red-50 hover:bg-red-100 text-red-700 text-sm font-medium px-4 py-2 rounded-lg cursor-pointer transition-colors">
        Stop session
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
