services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flowlist
      POSTGRES_PASSWORD: flowlist_dev_password
      POSTGRES_DB: flowlist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowlist"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://flowlist:flowlist_dev_password@db:5432/flowlist
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
